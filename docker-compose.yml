version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATASET_PATH=../dataset.csv
      - TOP_K=100
      - CHUNK_SIZE=200
      - AUDIO_WEIGHT=0.6
      - GENRE_WEIGHT=0.4
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=["http://localhost:5173","http://frontend:5173"]
    volumes:
      - ./backend:/app
      - ./dataset.csv:/app/../dataset.csv:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./spotify-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    volumes:
      - ./spotify-frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Precompute service (runs once to generate artifacts)
  precompute:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python scripts/precompute.py
    volumes:
      - ./backend:/app
      - ./dataset.csv:/app/../dataset.csv:ro
    profiles:
      - precompute

networks:
  default:
    name: wrapped-network